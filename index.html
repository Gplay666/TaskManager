<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Planner</title>
<style>
  :root {
    --bg: #f2f2f4;
    --panel: #ffffff;
    --panel-2: #f7f7f9;
    --toolbar: #e9e9ec;
    --border: #d4d4d8;
    --border-2: #e4e4e8;
    --text: #18181b;
    --muted: #71717a;
    --accent: #2c5282;
    --accent-h: #22436a;
    --danger: #a12a2a;
    --input-bg: #ffffff;
    --input-disabled: #f0f0f2;
    --hover-bg: #fbfbfd;
    --gline-major: #e0e0e4;
    --task-border: rgba(0,0,0,0.15);
    --task-outline: rgba(0,0,0,0.35);
    --violation: #b3261e;
    --violation-inset: #ffffff;
    --menu-btn-bg: rgba(0,0,0,0.25);
    --menu-btn-bg-h: rgba(0,0,0,0.45);
    --modal-backdrop: rgba(20,20,25,0.45);
    --modal-shadow: 0 10px 30px rgba(0,0,0,0.18);
    --popover-shadow: 0 6px 16px rgba(0,0,0,0.14);
    --ghost-shadow: 0 8px 20px rgba(0,0,0,0.25);
    --dep-self: #ffffff;
    --dep-up: #f0c674;
    --dep-down: #9ad19a;
    --mono: "SF Mono", "Menlo", "Consolas", "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a1d; --panel: #232327; --panel-2: #2a2a2f; --toolbar: #26262a;
      --border: #3a3a40; --border-2: #2e2e34; --text: #e6e6ea; --muted: #8a8a93;
      --accent: #5a8fd4; --accent-h: #4a7ec3; --danger: #e07a7a;
      --input-bg: #1a1a1d; --input-disabled: #2a2a2f; --hover-bg: #2a2a2f;
      --gline-major: #333338;
      --task-border: rgba(0,0,0,0.35); --task-outline: rgba(255,255,255,0.45);
      --violation: #e57373; --violation-inset: #232327;
      --menu-btn-bg: rgba(0,0,0,0.45); --menu-btn-bg-h: rgba(0,0,0,0.65);
      --modal-backdrop: rgba(0,0,0,0.6);
      --modal-shadow: 0 10px 30px rgba(0,0,0,0.55);
      --popover-shadow: 0 6px 16px rgba(0,0,0,0.5);
      --ghost-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1a1d; --panel: #232327; --panel-2: #2a2a2f; --toolbar: #26262a;
    --border: #3a3a40; --border-2: #2e2e34; --text: #e6e6ea; --muted: #8a8a93;
    --accent: #5a8fd4; --accent-h: #4a7ec3; --danger: #e07a7a;
    --input-bg: #1a1a1d; --input-disabled: #2a2a2f; --hover-bg: #2a2a2f;
    --gline-major: #333338;
    --task-border: rgba(0,0,0,0.35); --task-outline: rgba(255,255,255,0.45);
    --violation: #e57373; --violation-inset: #232327;
    --menu-btn-bg: rgba(0,0,0,0.45); --menu-btn-bg-h: rgba(0,0,0,0.65);
    --modal-backdrop: rgba(0,0,0,0.6);
    --modal-shadow: 0 10px 30px rgba(0,0,0,0.55);
    --popover-shadow: 0 6px 16px rgba(0,0,0,0.5);
    --ghost-shadow: 0 8px 20px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--sans); font-size: 14px; line-height: 1.4;
    color: var(--text); background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; background: var(--toolbar);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    flex-wrap: wrap;
  }
  .toolbar .sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
  .toolbar select,
  .toolbar button {
    font: inherit; font-size: 13px; padding: 5px 10px;
    border: 1px solid var(--border); border-radius: 2px;
    background: var(--panel); color: var(--text);
    cursor: pointer; height: 30px; line-height: 1;
  }
  .toolbar select { color-scheme: light dark; }
  .toolbar button:hover { background: var(--panel-2); }
  .toolbar button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .toolbar button.primary:hover { background: var(--accent-h); }
  .toolbar button.icon { width: 30px; padding: 0; font-family: var(--mono); font-size: 14px; }
  .toolbar button.icon.active { background: var(--panel-2); color: var(--accent); border-color: var(--accent); }
  .toolbar .spacer { flex: 1; }
  .toolbar .status {
    font-family: var(--mono); font-size: 12px; color: var(--muted); padding-right: 4px;
  }
  .toolbar .status .num { color: var(--text); }
  .toolbar .status .bad { color: var(--danger); }

  .day-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 14px; background: var(--panel-2);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    flex-wrap: wrap;
  }
  .day-bar input[type=date] {
    font: inherit; font-size: 13px; font-family: var(--mono);
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 2px;
    background: var(--panel); color: var(--text); height: 30px;
    color-scheme: light dark;
  }
  .day-bar button {
    font: inherit; font-size: 13px; padding: 5px 10px;
    border: 1px solid var(--border); border-radius: 2px;
    background: var(--panel); color: var(--text);
    cursor: pointer; height: 30px; line-height: 1;
  }
  .day-bar button.icon { width: 30px; padding: 0; font-family: var(--mono); }
  .day-bar button:hover { background: var(--panel-2); }
  .day-bar .weekday { font-size: 12px; color: var(--muted); padding-left: 4px; }
  .day-bar .spacer { flex: 1; }
  .day-bar .zoom-group { display: flex; gap: 4px; align-items: center; }
  .day-bar .zoom-level {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    padding: 0 6px; min-width: 44px; text-align: center;
  }

  /* ---------- layout ---------- */
  .content { display: flex; flex: 1; min-height: 0; }

  /* ---------- timeline ---------- */
  .timeline-panel {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    background: var(--panel); overflow: hidden;
  }
  .timeline-scroll {
    flex: 1; overflow-x: auto; overflow-y: hidden;
    position: relative; user-select: none;
  }
  .timeline-scroll::-webkit-scrollbar { height: 10px; }
  .timeline-scroll::-webkit-scrollbar-track { background: var(--panel-2); }
  .timeline-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .timeline-scroll::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  .timeline-inner { height: 100%; display: flex; flex-direction: column; }
  .ruler {
    height: 28px; border-bottom: 1px solid var(--border);
    background: var(--panel-2); position: relative; flex-shrink: 0;
  }
  .ruler .tick {
    position: absolute; top: 0; height: 100%; padding-left: 4px;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    border-left: 1px solid var(--border-2);
    display: flex; align-items: center; pointer-events: none;
  }
  .ruler .tick.major { color: var(--text); border-left-color: var(--border); }

  .tracks-wrap { flex: 1; position: relative; overflow: hidden; }
  .grid { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .grid .gline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border-2); }
  .grid .gline.major { background: var(--gline-major); }
  .grid .now { position: absolute; top: 0; bottom: 0; width: 1px; background: #c14343; }
  .grid .now::before {
    content: ""; position: absolute; top: -4px; left: -3px;
    width: 7px; height: 7px; border-radius: 50%; background: #c14343;
  }
  .tracks { position: absolute; inset: 0; z-index: 1; }
  .track { position: absolute; left: 0; right: 0; border-bottom: 1px solid var(--border-2); }

  .task {
    position: absolute; border-radius: 3px; color: #fff; overflow: hidden;
    cursor: grab; user-select: none; padding: 4px 7px;
    border: 1px solid var(--task-border); touch-action: none; font-size: 12px;
  }
  .task:hover { outline: 1px solid var(--task-outline); }
  .task.violation { border-color: var(--violation); box-shadow: inset 0 0 0 1px var(--violation-inset); }
  .task.dep-self { outline: 2px solid var(--dep-self); outline-offset: 0; z-index: 2; }
  .task.dep-upstream { outline: 2px solid var(--dep-up); outline-offset: 1px; z-index: 2; }
  .task.dep-downstream { outline: 2px dashed var(--dep-down); outline-offset: 1px; z-index: 2; }
  .task .task-name {
    font-weight: 600; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; line-height: 1.25;
  }
  .task .task-time {
    font-family: var(--mono); font-size: 11px; opacity: 0.9;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25;
  }
  .task .menu-btn {
    position: absolute; top: 3px; right: 3px; width: 18px; height: 18px;
    border-radius: 2px; background: var(--menu-btn-bg); color: #fff;
    border: none; cursor: pointer; opacity: 0; padding: 0;
    font-size: 11px; line-height: 16px; font-family: var(--mono);
  }
  .task:hover .menu-btn { opacity: 1; }
  .task .menu-btn:hover { background: var(--menu-btn-bg-h); }
  .task .resize-handle {
    position: absolute; top: 0; right: 0; bottom: 0; width: 7px;
    cursor: ew-resize; z-index: 3;
    background: transparent; transition: background 0.1s;
  }
  .task:hover .resize-handle { background: linear-gradient(to right, transparent, rgba(255,255,255,0.35)); }
  .task .resize-handle:hover { background: linear-gradient(to right, transparent, rgba(255,255,255,0.7)); }

  /* ---------- sidebar ---------- */
  .sidebar {
    width: 300px; border-left: 1px solid var(--border);
    background: var(--panel-2); display: flex; flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar.hidden { display: none; }
  .sidebar-head {
    padding: 10px 12px; font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted);
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .sidebar-head .count {
    font-family: var(--mono); color: var(--text);
    text-transform: none; letter-spacing: 0; margin-left: 4px;
  }
  .unscheduled-list { flex: 1; overflow-y: auto; }
  .u-item {
    position: relative; padding: 8px 12px 8px 16px;
    border-bottom: 1px solid var(--border-2);
    cursor: grab; user-select: none; background: var(--panel);
    touch-action: none;
  }
  .u-item:hover { background: var(--hover-bg); }
  .u-item .u-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .u-item .u-name {
    font-weight: 600; font-size: 13px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; padding-right: 24px;
  }
  .u-item .u-meta {
    font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px;
  }
  .u-item .menu-btn {
    position: absolute; top: 8px; right: 8px; width: 20px; height: 20px;
    border-radius: 2px; background: transparent; border: none;
    cursor: pointer; opacity: 0; color: var(--muted); padding: 0;
    font-size: 12px; font-family: var(--mono); line-height: 18px;
  }
  .u-item:hover .menu-btn { opacity: 1; }
  .u-item .menu-btn:hover { background: var(--border-2); color: var(--text); }
  .empty {
    padding: 18px 14px; color: var(--muted); font-size: 13px; text-align: center;
  }

  /* ---------- modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: var(--modal-backdrop);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 3px; padding: 0; min-width: 380px; max-width: 520px;
    min-height: 320px; box-shadow: var(--modal-shadow);
    font-size: 14px; color: var(--text);
    display: flex; flex-direction: column;
  }
  .modal .m-head {
    padding: 11px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel-2); font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
  }
  .modal .m-body { padding: 16px; }
  .modal label {
    display: block; margin-bottom: 12px; font-size: 12px;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;
  }
  .modal label > span { display: block; margin-bottom: 4px; }
  .modal input[type=text],
  .modal input[type=number],
  .modal input[type=date],
  .modal input[type=time],
  .modal input[type=datetime-local],
  .modal select {
    width: 100%; font: inherit; font-size: 14px; padding: 6px 9px;
    border: 1px solid var(--border); border-radius: 2px;
    background: var(--input-bg); color: var(--text);
    text-transform: none; letter-spacing: 0; font-family: var(--sans);
    color-scheme: light dark;
  }
  .modal input[type=date],
  .modal input[type=time],
  .modal input[type=datetime-local],
  .modal input[type=number] { font-family: var(--mono); font-size: 13px; }
  .modal input:disabled { background: var(--input-disabled); color: var(--muted); }
  .modal .row { display: flex; gap: 12px; }
  .modal .row > * { flex: 1; }
  .modal .m-foot {
    padding: 12px 16px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: flex-end;
    gap: 8px; background: var(--panel-2); margin-top: auto;
  }
  .modal button {
    font-size: 13px; padding: 6px 14px; border-radius: 2px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--text); cursor: pointer; height: 30px;
  }
  .modal button:hover { background: var(--panel-2); }
  .modal button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .modal button.primary:hover { background: var(--accent-h); }
  .modal button.icon-btn {
    width: 30px; padding: 0; font-family: var(--mono);
    font-size: 15px; line-height: 1;
  }
  .modal button.icon-btn.danger { color: var(--danger); }
  .modal dl {
    display: grid; grid-template-columns: 140px 1fr;
    gap: 8px 14px; margin: 0; font-size: 13px;
  }
  .modal dt {
    color: var(--muted); font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.05em; padding-top: 1px;
  }
  .modal dd { margin: 0; font-family: var(--mono); font-size: 13px; word-break: break-word; }
  .modal dd.plain { font-family: var(--sans); }
  .modal h3.sec {
    margin: 16px 0 8px; font-size: 12px; color: var(--danger);
    text-transform: uppercase; letter-spacing: 0.06em;
    border-top: 1px solid var(--border-2); padding-top: 12px;
  }
  .modal ul.viol { margin: 0; padding-left: 18px; font-size: 13px; color: var(--danger); }

  .deps-list {
    max-height: 150px; overflow-y: auto; border: 1px solid var(--border);
    border-radius: 2px; background: var(--input-bg); padding: 5px 9px;
    margin-bottom: 12px; font-size: 13px;
  }
  .deps-item {
    display: flex; align-items: center; gap: 8px; padding: 4px 3px;
    cursor: pointer; border-radius: 2px; color: var(--text); font-size: 13px;
  }
  .deps-item:hover { background: var(--panel-2); }
  .deps-item input { margin: 0; cursor: pointer; accent-color: var(--accent); }
  .deps-empty { color: var(--muted); font-size: 12px; padding: 4px 3px; }
  .deps-note {
    font-size: 11px; color: var(--muted); text-transform: none;
    letter-spacing: 0; margin-top: -8px; margin-bottom: 12px;
  }

  /* ---------- project management ---------- */
  .proj-list { display: flex; flex-direction: column; gap: 2px; }
  .proj-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 2px; background: var(--input-bg);
  }
  .proj-item .proj-name { flex: 1; font-size: 14px; font-weight: 500; }
  .proj-item input.proj-name-input {
    flex: 1; font: inherit; font-size: 14px; padding: 4px 6px;
    border: 1px solid var(--accent); border-radius: 2px;
    background: var(--input-bg); color: var(--text);
  }
  .proj-item .proj-count {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    white-space: nowrap;
  }
  .proj-new-form {
    display: flex; gap: 8px; margin-top: 12px;
    padding-top: 12px; border-top: 1px solid var(--border-2);
  }
  .proj-new-form input {
    flex: 1; font: inherit; font-size: 14px; padding: 6px 9px;
    border: 1px solid var(--border); border-radius: 2px;
    background: var(--input-bg); color: var(--text);
  }
  .proj-new-form button {
    font-size: 13px; padding: 6px 14px; border-radius: 2px;
    border: 1px solid var(--accent); background: var(--accent);
    color: #fff; cursor: pointer; height: 30px;
  }
  .proj-new-form button:hover { background: var(--accent-h); }

  /* ---------- popover ---------- */
  .popover {
    position: fixed; z-index: 2000; background: var(--panel);
    border: 1px solid var(--border); border-radius: 2px;
    box-shadow: var(--popover-shadow); padding: 3px; min-width: 150px;
  }
  .popover button {
    display: block; width: 100%; text-align: left; padding: 6px 12px;
    border: none; background: transparent; font: inherit; font-size: 13px;
    cursor: pointer; border-radius: 2px; color: var(--text);
  }
  .popover button:hover { background: var(--panel-2); }
  .popover button.danger { color: var(--danger); }
  .popover .sep { height: 1px; background: var(--border-2); margin: 3px 0; }

  .drag-ghost {
    position: fixed !important; pointer-events: none; z-index: 1500;
    opacity: 0.85; box-shadow: var(--ghost-shadow);
  }
  body.dragging { cursor: grabbing; }
  body.dragging * { cursor: grabbing !important; }

  /* ---------- responsive ---------- */
  @media (max-width: 800px) {
    .toolbar { padding: 6px 10px; gap: 6px; }
    .toolbar .status { order: 99; flex-basis: 100%; padding-left: 0; }
    .sidebar { width: 240px; }
    .modal { min-width: 320px; max-width: calc(100vw - 24px); }
    .day-bar .zoom-level { display: none; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <select id="project-select" title="Project"></select>
  <span class="sep"></span>
  <button id="btn-add" class="primary">New task</button>
  <button id="btn-autofill" title="Schedule all unscheduled tasks in current project">Auto-fill</button>
  <button id="btn-projects" title="Manage projects">Projects</button>
  <span class="spacer"></span>
  <span id="status" class="status"></span>
  <button id="btn-undo" class="icon" title="Undo (Ctrl+Z)" disabled>&#x21B6;</button>
  <button id="btn-sidebar" class="icon" title="Toggle sidebar">&#x2630;</button>
  <button id="theme-toggle" class="icon" title="Toggle theme"></button>
</div>

<div class="day-bar">
  <button class="icon" id="day-prev" title="Previous day">&lt;</button>
  <input type="date" id="day-input">
  <button class="icon" id="day-next" title="Next day">&gt;</button>
  <button id="day-today">Today</button>
  <span class="weekday" id="day-weekday"></span>
  <span class="spacer"></span>
  <div class="zoom-group">
    <button class="icon" id="zoom-out" title="Zoom out">&minus;</button>
    <span class="zoom-level" id="zoom-level">100%</span>
    <button class="icon" id="zoom-in" title="Zoom in">+</button>
    <button id="zoom-fit" title="Fit full day">Fit</button>
  </div>
</div>

<div class="content">
  <div class="timeline-panel">
    <div class="timeline-scroll" id="timeline-scroll">
      <div class="timeline-inner" id="timeline-inner">
        <div class="ruler" id="ruler"></div>
        <div class="tracks-wrap">
          <div class="grid" id="grid"></div>
          <div class="tracks" id="tracks"></div>
        </div>
      </div>
    </div>
  </div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">Not scheduled <span class="count" id="u-count">0</span></div>
    <div class="unscheduled-list" id="unscheduled-list"></div>
  </aside>
</div>

<div id="modal-root"></div>
<div id="menu-root"></div>

<script>
"use strict";
const API = "http://localhost:8000";
const DAY_MS = 24 * 3600 * 1000;
const MIN_PX_PER_MIN = 0.7;

const PALETTE = [
  "#5b7a99", "#a5764f", "#7d8f5c", "#8f5c6e", "#5c7d7d",
  "#a08d4f", "#6c5c8f", "#8f5c5c", "#4f6d5c", "#6c6c6c",
];

const state = {
  projects: [],
  currentProject: "all",
  tasks: [],
  schedule: [],
  violations: [],
  dayStart: (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })(),
  pxPerMin: 1,
};

/* ---------- theme ---------- */

function getEffectiveTheme() {
  const explicit = document.documentElement.dataset.theme;
  if (explicit === "dark" || explicit === "light") return explicit;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function updateThemeIcon() {
  const btn = document.getElementById("theme-toggle");
  if (!btn) return;
  const eff = getEffectiveTheme();
  btn.textContent = eff === "dark" ? "\u2600" : "\u263E";
  btn.title = eff === "dark" ? "Switch to light theme" : "Switch to dark theme";
}
function initTheme() {
  let stored = null;
  try { stored = localStorage.getItem("theme"); } catch (_) {}
  if (stored === "dark" || stored === "light") {
    document.documentElement.dataset.theme = stored;
  }
  updateThemeIcon();
}
function toggleTheme() {
  const next = getEffectiveTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (_) {}
  updateThemeIcon();
}
initTheme();

/* ---------- undo history ---------- */

const MAX_HISTORY = 50;
const history = [];

function snapSchedule() {
  return state.schedule.map(s => ({ task_id: s.task_id, start: s.start }));
}
function pushUndo() {
  history.push(snapSchedule());
  if (history.length > MAX_HISTORY) history.shift();
  updateUndoBtn();
}
function updateUndoBtn() {
  const btn = document.getElementById("btn-undo");
  if (!btn) return;
  btn.disabled = history.length === 0;
}
async function undo() {
  if (history.length === 0) return;
  const snap = history.pop();
  updateUndoBtn();
  const cur = new Map(state.schedule.map(s => [s.task_id, s.start]));
  const want = new Map(snap.map(s => [s.task_id, s.start]));

  try {
    for (const [tid, start] of cur) {
      if (!want.has(tid)) {
        await api("/tasks/" + tid + "/schedule", { method: "DELETE" });
      } else if (want.get(tid) !== start) {
        await api("/tasks/" + tid + "/schedule", {
          method: "PUT", body: JSON.stringify({ start: want.get(tid) }),
        });
      }
    }
    for (const [tid, start] of want) {
      if (!cur.has(tid)) {
        await api("/tasks/" + tid + "/schedule", {
          method: "PUT", body: JSON.stringify({ start }),
        });
      }
    }
  } catch (err) {
    console.error("undo failed mid-way:", err);
  }
  await reload();
}

/* ---------- zoom ---------- */

let zoom = 1;
let zoomInitialized = false;
const MIN_ZOOM = 0.4;
const MAX_ZOOM = 12;

function clampZoom(z) { return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z)); }
function updateZoomLabel() {
  const el = document.getElementById("zoom-level");
  if (el) el.textContent = Math.round(zoom * 100) + "%";
}
function setZoom(z) {

}
function resetZoom() { setZoom(1); }

/* ---------- sidebar ---------- */

let sidebarCollapsed = false;
function initSidebar() {
  try {
    const stored = localStorage.getItem("sidebar-collapsed");
    if (stored !== null) sidebarCollapsed = stored === "1";
    else sidebarCollapsed = window.matchMedia("(max-width: 800px)").matches;

  if (btn) btn.classList.toggle("active", !sidebarCollapsed);

  applySidebar();
}

/* ---------- API ---------- */

async function api(path, init) {
  let r;
  try {
    r = await fetch(API + path, {
      ...init,
      headers: { "Content-Type": "application/json",
                 ...(init && init.headers ? init.headers : {}) },
    });
  } catch (e) { throw new Error("Cannot reach API at " + API); }
  if (!r.ok) {
    let detail;
    try { detail = (await r.json()).detail; } catch (_) { detail = r.statusText; }
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
  }
  if (r.status === 204) return null;
  return r.json();
}

async function loadAll() {
  state.projects = await api("/projects");
  const perProject = await Promise.all(state.projects.map(async (p) => {
    const [tasks, schedule, violations] = await Promise.all([
      api(`/projects/${p.id}/tasks`),
      api(`/projects/${p.id}/schedule`),
      api(`/projects/${p.id}/violations`).catch(() => []),
    ]);
    return { project: p, tasks, schedule, violations };
  }));
  state.tasks = []; state.schedule = []; state.violations = [];
  for (const { project, tasks, schedule, violations } of perProject) {
    for (const t of tasks) state.tasks.push(Object.assign({ project_id: project.id }, t));
    for (const s of schedule) state.schedule.push(Object.assign({ project_id: project.id }, s));
    for (const v of violations) state.violations.push(Object.assign({ project_id: project.id }, v));
  }
}

/* ---------- helpers ---------- */

function colorFor(pid) { return PALETTE[(pid - 1 + PALETTE.length) % PALETTE.length]; }
function pad2(n) { return String(n).padStart(2, "0"); }
function fmtHM(iso) { const d = new Date(iso); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function fmtDT(iso) {
  if (!iso) return "\u2014";
  const d = new Date(iso);
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()) +
         " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function toDateInputValue(d) {
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
function parseDateInput(v) {
  const [y, m, d] = v.split("-").map(Number);
  const out = new Date(y, m - 1, d);
  out.setHours(0,0,0,0);
  return out;
}
function fmtDuration(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.round((sec % 3600) / 60);
  if (h && m) return h + "h " + m + "m";
  if (h) return h + "h";
  return m + "m";
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function snapDateToMinutes(date, step) {
  step = step || 5;
  const ms = date.getTime();
  return new Date(Math.round(ms / (step * 60000)) * step * 60000);
}
function isoLocal(d) {
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()) +
         "T" + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":00";
}
function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()) +
         "T" + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function fromLocal(v) { return v ? (v.length === 16 ? v + ":00" : v) : null; }
function weekdayName(d) {
  return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
}
function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}

function dayBounds() {
  const s = state.dayStart.getTime();
  return { startMs: s, endMs: s + DAY_MS };
}
function tasksInDay() {
  const { startMs, endMs } = dayBounds();
  const byId = new Map(state.tasks.map(t => [t.id, t]));
  let entries = state.schedule.map(s => {
    const task = byId.get(s.task_id);
    if (!task) return null;
    const a = new Date(s.start).getTime();
    const b = new Date(s.end).getTime();
    if (b <= startMs || a >= endMs) return null;
    return Object.assign({}, s, { task, project_id: task.project_id, _a: a, _b: b });
  }).filter(Boolean);
  if (state.currentProject !== "all") {
    const pid = +state.currentProject;
    entries = entries.filter(e => e.project_id === pid);
  }
  return entries;
}
function visibleTasks() {
  if (state.currentProject === "all") return state.tasks;
  const pid = +state.currentProject;
  return state.tasks.filter(t => t.project_id === pid);
}
function visibleViolations() {
  if (state.currentProject === "all") return state.violations;
  const pid = +state.currentProject;
  return state.violations.filter(v => v.project_id === pid);
}

/* ---------- layout ---------- */

function assignTracks(entries) {
  const sorted = entries.slice().sort((a, b) => a._a - b._a);
  const tracks = [];
  for (const e of sorted) {
    let placed = false;
    for (const track of tracks) {
      const ok = track.every(x => x._b <= e._a || e._b <= x._a);
      if (ok) { track.push(e); placed = true; break; }
    }
    if (!placed) tracks.push([e]);
  }
  return tracks;
}

/* ---------- render ---------- */

function render() {
  renderProjectSelect();
  renderDayBar();
  renderTimeline();
  renderUnscheduled();
  renderStatus();
  updateZoomLabel();
}

function renderProjectSelect() {
  const sel = document.getElementById("project-select");
  const prev = state.currentProject;
  sel.innerHTML = "";
  const optAll = document.createElement("option");
  optAll.value = "all"; optAll.textContent = "All projects";

    const o = document.createElement("option");
    o.value = String(p.id); o.textContent = p.name;

function renderDayBar() {
  document.getElementById("day-input").value = toDateInputValue(state.dayStart);
  document.getElementById("day-weekday").textContent = weekdayName(state.dayStart);
}

/* map task.id -> DOM element, for hover highlight */
const taskEls = new Map();

function renderTimeline() {
  const scroll = document.getElementById("timeline-scroll");
  const inner = document.getElementById("timeline-inner");
  const vw = Math.max(scroll.clientWidth, 200);

  if (!zoomInitialized) {
    zoomInitialized = true;
    const fit = vw / (24 * 60);
    if (fit < MIN_PX_PER_MIN) {
      zoom = clampZoom(MIN_PX_PER_MIN / fit);
    }
    updateZoomLabel();
  }

  const pxPerMin = (vw / (24 * 60)) * zoom;
  state.pxPerMin = pxPerMin;
  const canvasW = Math.max(1440 * pxPerMin, vw);
  inner.style.width = canvasW + "px";

  const entries = tasksInDay();
  const violSet = new Set(visibleViolations().map(v => v.task_id + ":" + v.project_id));

  const tracks = assignTracks(entries);
  const trackCount = Math.max(tracks.length, 3);
  const trackH = 48;
  const tracksHeight = trackCount * trackH;

  const tracksWrap = document.querySelector(".tracks-wrap");
  tracksWrap.style.height = tracksHeight + "px";

  const ruler = document.getElementById("ruler");
  ruler.innerHTML = "";
  for (let h = 0; h <= 23; h++) {
    const div = document.createElement("div");
    div.className = "tick" + (h % 3 === 0 ? " major" : "");
    div.style.left = (h * 60 * pxPerMin) + "px";
    div.textContent = pad2(h);
    ruler.appendChild(div);
  }

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (let h = 0; h <= 24; h++) {
    const line = document.createElement("div");
    line.className = "gline" + (h % 3 === 0 ? " major" : "");
    line.style.left = (h * 60 * pxPerMin) + "px";
    grid.appendChild(line);
  }
  const now = new Date();
  if (isSameDay(now, state.dayStart)) {
    const nowLine = document.createElement("div");
    nowLine.className = "now";
    nowLine.style.left = ((now.getHours() * 60 + now.getMinutes()) * pxPerMin) + "px";
    grid.appendChild(nowLine);
  }

  const tracksEl = document.getElementById("tracks");
  tracksEl.innerHTML = "";
  taskEls.clear();
  for (let i = 0; i < trackCount; i++) {
    const tr = document.createElement("div");
    tr.className = "track";
    tr.style.top = (i * trackH) + "px";
    tr.style.height = trackH + "px";
    tracksEl.appendChild(tr);
  }

  const { startMs, endMs } = dayBounds();
  const idxByTask = new Map();
  tracks.forEach((tr, idx) => tr.forEach(e => idxByTask.set(e.task.id, idx)));

  for (const e of entries) {
    const a = Math.max(e._a, startMs);
    const b = Math.min(e._b, endMs);
    const x = (a - startMs) / 60000 * pxPerMin;
    const w = (b - a) / 60000 * pxPerMin;
    const idx = idxByTask.get(e.task.id) || 0;
    const y = idx * trackH + 3;
    const h = trackH - 6;

    const el = document.createElement("div");
    el.className = "task";
    if (violSet.has(e.task.id + ":" + e.project_id)) el.classList.add("violation");
    el.style.background = colorFor(e.project_id);
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.width = Math.max(w, 28) + "px";
    el.style.height = h + "px";

    const deps = (e.task.dependencies || []);
    const depLabels = deps.map(d => "[" + d + "]").join(" ");
    el.title = e.task.name + "  " + fmtHM(e.start) + "\u2013" + fmtHM(e.end) +
               (deps.length ? "  \u2022  after: " + depLabels : "");

    const showText = w >= 50;
    el.innerHTML =
      (showText
        ? '<div class="task-name">' + esc(e.task.name) + '</div>' +
          (w >= 80 ? '<div class="task-time">' + fmtHM(e.start) + '\u2013' + fmtHM(e.end) + '</div>' : '')
        : '') +
      '<div class="resize-handle"></div>' +
      '<button class="menu-btn" type="button">\u22ef</button>';

    const mb = el.querySelector(".menu-btn");
    mb.addEventListener("pointerdown", ev => ev.stopPropagation());
    mb.addEventListener("click", ev => {
      ev.stopPropagation();
      openTaskMenu(mb, e.task);
    });

    attachTimelineDrag(el, e);
    attachResize(el, e);
    attachHover(el, e.task);

    taskEls.set(e.task.id, el);
    tracksEl.appendChild(el);
  }
}

function renderUnscheduled() {
  const list = document.getElementById("unscheduled-list");
  list.innerHTML = "";
  const scheduledIds = new Set(state.schedule.map(s => s.task_id));
  const unscheduled = visibleTasks()
    .filter(t => !scheduledIds.has(t.id))

function renderStatus() {

/* ---------- hover: dependency highlight ---------- */

function attachHover(el, task) {
  el.addEventListener("pointerenter", () => {
    if (document.body.classList.contains("dragging")) return;
    highlightDeps(task);
  });
  el.addEventListener("pointerleave", () => clearDepHighlight());
}

function highlightDeps(task) {
  clearDepHighlight();
  const upstream = new Set(task.dependencies || []);
  const downstream = new Set();
  for (const t of state.tasks) {
    if (t.project_id !== task.project_id) continue;
    if ((t.dependencies || []).includes(task.id)) downstream.add(t.id);
  }
  taskEls.get(task.id)?.classList.add("dep-self");
  for (const id of upstream) taskEls.get(id)?.classList.add("dep-upstream");
  for (const id of downstream) taskEls.get(id)?.classList.add("dep-downstream");
}
function clearDepHighlight() {
  for (const el of taskEls.values()) {
    el.classList.remove("dep-upstream", "dep-downstream", "dep-self");
  }
}

/* ---------- drag: timeline body ---------- */

function attachTimelineDrag(el, entry) {
  el.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0) return;
    if (ev.target.closest(".menu-btn")) return;
    if (ev.target.closest(".resize-handle")) return;

    const startX = ev.clientX, startY = ev.clientY;
    const rect = el.getBoundingClientRect();
    const offX = ev.clientX - rect.left;
    const offY = ev.clientY - rect.top;
    let dragging = false;
    let ghost = null;

    const onMove = (e) => {
      if (!dragging) {
        if (Math.hypot(e.clientX - startX, e.clientY - startY) < 4) return;
        dragging = true;
        ghost = el.cloneNode(true);
        ghost.classList.add("drag-ghost");
        ghost.style.width = rect.width + "px";
        ghost.style.height = rect.height + "px";
        ghost.style.left = (e.clientX - offX) + "px";
        ghost.style.top = (e.clientY - offY) + "px";
        document.body.appendChild(ghost);
        el.style.opacity = "0.35";
        document.body.classList.add("dragging");
      }
      ghost.style.left = (e.clientX - offX) + "px";
      ghost.style.top = (e.clientY - offY) + "px";
    };

    const onUp = async (e) => {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      if (!dragging) return;
      ghost.remove();
      el.style.opacity = "";
      document.body.classList.remove("dragging");

      const sidebar = document.getElementById("sidebar");
      const sb = sidebar.getBoundingClientRect();
      const sidebarVisible = !sidebar.classList.contains("hidden");
      if (sidebarVisible &&
          e.clientX >= sb.left && e.clientX <= sb.right &&
          e.clientY >= sb.top && e.clientY <= sb.bottom) {
        pushUndo();
        try {
          await api("/tasks/" + entry.task.id + "/schedule", { method: "DELETE" });
          await reload();
        } catch (err) { alert(err.message); }
        return;
      }

      const tracksEl = document.getElementById("tracks");
      const tr = tracksEl.getBoundingClientRect();
      if (e.clientX >= tr.left && e.clientX <= tr.right &&
          e.clientY >= tr.top && e.clientY <= tr.bottom) {
        const { startMs, endMs } = dayBounds();
        const cursorMin = (e.clientX - tr.left) / state.pxPerMin;
        const offsetMin = offX / state.pxPerMin;
        let startMsNew = startMs + (cursorMin - offsetMin) * 60000;
        const durMs = entry._b - entry._a;
        startMsNew = Math.max(startMs, Math.min(startMsNew, endMs - durMs));
        const snapped = snapDateToMinutes(new Date(startMsNew), 5);
        pushUndo();
        try {
          await api("/tasks/" + entry.task.id + "/schedule", {
            method: "PUT",
            body: JSON.stringify({ start: isoLocal(snapped) }),
          });
          await reload();
        } catch (err) { alert(err.message); }
      }
    };

    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  });
}

/* ---------- resize ---------- */

function attachResize(el, entry) {
  const handle = el.querySelector(".resize-handle");
  if (!handle) return;

  handle.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0) return;
    ev.stopPropagation();

    const startX = ev.clientX;
    const origStartMs = new Date(entry.start).getTime();
    const origDurSec = entry.task.duration_seconds;
    const origVisibleW = parseFloat(el.style.width);
    const { startMs: dayStartMs, endMs: dayEndMs } = dayBounds();
    let dragging = false;
    let newDurSec = origDurSec;

    const onMove = (e) => {
      const dx = e.clientX - startX;
      if (!dragging) {
        if (Math.abs(dx) < 2) return;
        dragging = true;
        document.body.classList.add("dragging");
      }

      const dxSec = (dx / state.pxPerMin) * 60;
      let d = origDurSec + dxSec;
      d = Math.max(5 * 60, d);
      d = Math.round(d / (5 * 60)) * (5 * 60);

      // clamp by day end
      const maxDur = (dayEndMs - origStartMs) / 1000;
      if (maxDur > 0) d = Math.min(d, maxDur);

      newDurSec = d;

      const newEndMs = origStartMs + d * 1000;
      const visA = Math.max(origStartMs, dayStartMs);
      const visB = Math.min(newEndMs, dayEndMs);
      const visW = (visB - visA) / 60000 * state.pxPerMin;
      el.style.width = Math.max(visW, 28) + "px";
    };

    const onUp = async (e) => {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      document.body.classList.remove("dragging");
      if (!dragging) return;
      if (newDurSec === origDurSec) { await reload(); return; }
      pushUndo();
      try {
        await api("/tasks/" + entry.task.id, {
          method: "PATCH",
          body: JSON.stringify({ duration_seconds: Math.round(newDurSec) }),
        });
        await reload();
      } catch (err) { alert(err.message); await reload(); }
    };

    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  });
}

/* ---------- popover ---------- */

function openTaskMenu(anchor, task) {
  closeMenu();
  const menu = document.createElement("div");
  menu.className = "popover";
  const scheduled = state.schedule.some(s => s.task_id === task.id);
  menu.innerHTML =
    '<button data-act="details">Details</button>' +
    '<button data-act="move">' + (scheduled ? 'Move to\u2026' : 'Schedule at\u2026') + '</button>' +
    '<div class="sep"></div>' +
    '<button data-act="delete" class="danger">Delete</button>';
  const r = anchor.getBoundingClientRect();
  menu.style.left = Math.max(4, Math.min(r.left, window.innerWidth - 180)) + "px";
  menu.style.top = (r.bottom + 3) + "px";

  menu.addEventListener("click", async (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const act = btn.dataset.act;
    closeMenu();
    if (act === "details") openDetailsModal(task);
    else if (act === "move") openMoveModal(task);
    else if (act === "delete") {
      if (!confirm('Delete "' + task.name + '"?')) return;
      try { await api("/tasks/" + task.id, { method: "DELETE" }); await reload(); }
      catch (err) { alert(err.message); }
    }
  });

  document.getElementById("menu-root").appendChild(menu);
  const off = (e) => { if (!menu.contains(e.target)) closeMenu(); };
  setTimeout(() => document.addEventListener("pointerdown", off, true), 0);
  menu._off = off;
}

function closeMenu() {
  const root = document.getElementById("menu-root");
  Array.from(root.children).forEach(child => {
    if (child._off) document.removeEventListener("pointerdown", child._off, true);
    child.remove();
  });
}

/* ---------- modals ---------- */

function openModal(html, onMount) {
  closeModal();
  const root = document.getElementById("modal-root");
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = '<div class="modal">' + html + '</div>';
  backdrop.addEventListener("pointerdown", (e) => { if (e.target === backdrop) closeModal(); });
  root.appendChild(backdrop);
  if (onMount) onMount(backdrop.querySelector(".modal"));
}
function swapModalContent(html, onMount) {
  const backdrop = document.querySelector(".modal-backdrop");
  if (!backdrop) { openModal(html, onMount); return; }
  const m = backdrop.querySelector(".modal");
  m.innerHTML = html;
  if (onMount) onMount(m);
}
function closeModal() { document.getElementById("modal-root").innerHTML = ""; }

/* ---------- task form ---------- */

function openTaskFormModal(task, opts) {
  opts = opts || {};
  const isEdit = task != null;

  let pid, prefill;
  if (isEdit) {
    pid = task.project_id;
    prefill = {
      name: task.name,
      dur_h: Math.floor(task.duration_seconds / 3600),
      dur_m: Math.floor((task.duration_seconds % 3600) / 60),
      earliest_start: task.earliest_start ? toLocalInput(task.earliest_start) : "",
      deadline: task.deadline ? toLocalInput(task.deadline) : "",
      dependencies: (task.dependencies || []).slice(),
    };
  } else {
    if (state.projects.length === 0) { alert("No projects available"); return; }
    const inProject = state.currentProject !== "all";
    pid = inProject ? +state.currentProject : state.projects[0].id;
    prefill = {
      name: "", dur_h: 1, dur_m: 0,
      earliest_start: "", deadline: "", dependencies: [],
    };
  }

  const lockProject = isEdit || state.currentProject !== "all";
  const projectOptions = state.projects.map(p =>
    '<option value="' + p.id + '"' + (p.id === pid ? " selected" : "") + ">" +
    esc(p.name) + "</option>"
  ).join("");

  function depsHtmlFor(projectId) {
    const others = state.tasks.filter(t =>
      t.project_id === projectId && (!isEdit || t.id !== task.id)
    );
    if (others.length === 0) return '<div class="deps-empty">No other tasks in this project</div>';
    return others.map(t => (
      '<label class="deps-item">' +
        '<input type="checkbox" value="' + t.id + '"' +
          (prefill.dependencies.indexOf(t.id) !== -1 ? " checked" : "") + '>' +
        '<span>[' + t.id + '] ' + esc(t.name) + '</span>' +
      '</label>'
    )).join("");
  }

  const html =
    '<div class="m-head">' + (isEdit ? "Edit task" : "New task") + '</div>' +
    '<form id="task-form">' +
    '<div class="m-body">' +
      '<label><span>Project</span>' +
        '<select name="project_id"' + (lockProject ? " disabled" : "") + '>' + projectOptions + '</select>' +
      '</label>' +
      '<label><span>Name</span>' +
        '<input type="text" name="name" required autocomplete="off" value="' + esc(prefill.name) + '">' +
      '</label>' +
      '<div class="row">' +
        '<label><span>Hours</span><input type="number" name="dur_h" min="0" value="' + prefill.dur_h + '"></label>' +
        '<label><span>Minutes</span><input type="number" name="dur_m" min="0" max="59" value="' + prefill.dur_m + '"></label>' +
      '</div>' +
      '<label><span>Earliest start</span>' +
        '<input type="datetime-local" name="earliest_start" value="' + prefill.earliest_start + '">' +
      '</label>' +
      '<label><span>Deadline</span>' +
        '<input type="datetime-local" name="deadline" value="' + prefill.deadline + '">' +
      '</label>' +
      '<label style="margin-bottom:4px"><span>Dependencies</span></label>' +
      '<div class="deps-list" id="deps-list">' + depsHtmlFor(pid) + '</div>' +
      '<div class="deps-note">Selected tasks must finish before this one starts.</div>' +
    '</div>' +
    '<div class="m-foot">' +
      '<button type="button" data-close>Cancel</button>' +
      '<button type="submit" class="primary">' + (isEdit ? "Save" : "Create") + '</button>' +
    '</div>' +
    '</form>';

  const mountFn = (m) => {
    const projSelect = m.querySelector('select[name="project_id"]');
    if (!lockProject && projSelect) {
      projSelect.addEventListener("change", (e) => {
        const newPid = +e.target.value;
        m.querySelector("#deps-list").innerHTML = depsHtmlFor(newPid);
      });
    }

    m.querySelector("[data-close]").addEventListener("click", closeModal);
    m.querySelector("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const targetPid = isEdit ? task.project_id : (+fd.get("project_id") || pid);
      const dur = (+fd.get("dur_h") || 0) * 3600 + (+fd.get("dur_m") || 0) * 60;
      if (dur <= 0) { alert("Duration must be positive"); return; }

      const newDeps = new Set();
      m.querySelectorAll("#deps-list input:checked").forEach(cb => newDeps.add(+cb.value));

      const payload = {
        name: String(fd.get("name") || "").trim(),
        duration_seconds: dur,
        earliest_start: fromLocal(fd.get("earliest_start")),
        deadline: fromLocal(fd.get("deadline")),
      };

      try {
        if (isEdit) {
          await api("/tasks/" + task.id, { method: "PATCH", body: JSON.stringify(payload) });
          const oldDeps = new Set(task.dependencies || []);
          const toAdd = [...newDeps].filter(d => !oldDeps.has(d));
          const toRemove = [...oldDeps].filter(d => !newDeps.has(d));
          for (const dep of toAdd) {
            await api("/tasks/" + task.id + "/dependencies", {
              method: "POST", body: JSON.stringify({ depends_on: dep }),
            });
          }
          for (const dep of toRemove) {
            await api("/tasks/" + task.id + "/dependencies/" + dep, { method: "DELETE" });
          }
        } else {
          payload.dependencies = [...newDeps];
          await api("/projects/" + targetPid + "/tasks", {
            method: "POST", body: JSON.stringify(payload),
          });
        }
        closeModal();
        await reload();
      } catch (err) { alert(err.message); }
    });
    setTimeout(() => { const f = m.querySelector('input[name="name"]'); if (f) f.focus(); }, 0);
  };

  if (opts.replace) swapModalContent(html, mountFn);
  else openModal(html, mountFn);
}

/* ---------- move modal ---------- */

function openMoveModal(task) {
  const entry = state.schedule.find(s => s.task_id === task.id);
  let d;
  if (entry) d = new Date(entry.start);
  else { d = new Date(state.dayStart); d.setHours(9, 0, 0, 0); }
  const dateVal = d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
  const timeVal = pad2(d.getHours()) + ":" + pad2(d.getMinutes());

  const html =
    '<div class="m-head">' + (entry ? "Move task" : "Schedule task") + '</div>' +
    '<form id="move-form">' +
    '<div class="m-body">' +
      '<div style="font-size:14px;margin-bottom:14px;color:var(--text)">' + esc(task.name) + '</div>' +
      '<div class="row">' +
        '<label><span>Date</span><input type="date" name="date" value="' + dateVal + '" required></label>' +
        '<label><span>Time</span><input type="time" name="time" value="' + timeVal + '" required></label>' +
      '</div>' +
      '<div style="font-size:12px;color:var(--muted)">Duration: ' +
        fmtDuration(task.duration_seconds) +
        (entry ? ' \u00b7 currently ' + fmtDT(entry.start) : '') +
      '</div>' +
    '</div>' +
    '<div class="m-foot">' +
      (entry ? '<button type="button" data-unsched>Unschedule</button>' : '') +
      '<span style="flex:1"></span>' +
      '<button type="button" data-close>Cancel</button>' +
      '<button type="submit" class="primary">' + (entry ? "Move" : "Schedule") + '</button>' +
    '</div>' +
    '</form>';

  openModal(html, (m) => {
    m.querySelector("[data-close]").addEventListener("click", closeModal);
    const uns = m.querySelector("[data-unsched]");
    if (uns) uns.addEventListener("click", async () => {
      pushUndo();
      try {
        await api("/tasks/" + task.id + "/schedule", { method: "DELETE" });
        closeModal(); await reload();
      } catch (err) { alert(err.message); }
    });
    m.querySelector("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const [y, mo, da] = String(fd.get("date")).split("-").map(Number);
      const [hh, mm] = String(fd.get("time")).split(":").map(Number);
      const dt = new Date(y, mo - 1, da, hh, mm, 0, 0);
      pushUndo();
      try {
        await api("/tasks/" + task.id + "/schedule", {
          method: "PUT", body: JSON.stringify({ start: isoLocal(dt) }),
        });
        closeModal(); await reload();
      } catch (err) { alert(err.message); }
    });
    setTimeout(() => { const f = m.querySelector('input[name="time"]'); if (f) f.focus(); }, 0);
  });
}

/* ---------- details modal ---------- */

function openDetailsModal(task) {
  const entry = state.schedule.find(s => s.task_id === task.id);
  const project = state.projects.find(p => p.id === task.project_id);
  const viols = state.violations.filter(v =>
    v.task_id === task.id && v.project_id === task.project_id);
  const depNames = (task.dependencies || []).map(id => {
    const t = state.tasks.find(x => x.id === id);
    return t ? ("[" + id + "] " + t.name) : ("[" + id + "]");
  });

  const scheduleLine = entry
    ? fmtDT(entry.start) + " \u2014 " + fmtDT(entry.end)
    : "not scheduled";

  const html =
    '<div class="m-head">Task details</div>' +
    '<div class="m-body">' +
      '<dl>' +
        '<dt>Name</dt><dd class="plain">' + esc(task.name) + '</dd>' +
        '<dt>ID</dt><dd>' + task.id + '</dd>' +
        '<dt>Project</dt><dd class="plain">' + esc(project ? project.name : "\u2014") + '</dd>' +
        '<dt>Duration</dt><dd>' + fmtDuration(task.duration_seconds) + '</dd>' +
        '<dt>Earliest start</dt><dd>' + fmtDT(task.earliest_start) + '</dd>' +
        '<dt>Deadline</dt><dd>' + fmtDT(task.deadline) + '</dd>' +
        '<dt>Scheduled</dt><dd>' + scheduleLine + '</dd>' +
        '<dt>Depends on</dt><dd class="plain">' +
          (depNames.length ? depNames.map(esc).join("<br>") : "\u2014") +
        '</dd>' +
      '</dl>' +
      (viols.length
        ? '<h3 class="sec">Violations</h3>' +
          '<ul class="viol">' + viols.map(v => "<li>" + esc(v.message) + "</li>").join("") + "</ul>"
        : "") +
    '</div>' +
    '<div class="m-foot">' +
      '<button type="button" class="icon-btn" data-edit title="Edit">\u270E</button>' +
      '<span style="flex:1"></span>' +
      '<button type="button" data-close class="primary">Close</button>' +
    '</div>';

  openModal(html, (m) => {
    m.querySelector("[data-close]").addEventListener("click", closeModal);
    m.querySelector("[data-edit]").addEventListener("click", () => {
      openTaskFormModal(task, { replace: true });
    });
  });
}

/* ---------- projects modal ---------- */

function openProjectsModal() {
  const list = state.projects.map(p => {
    const taskCount = state.tasks.filter(t => t.project_id === p.id).length;
    return '<div class="proj-item" data-id="' + p.id + '">' +
      '<span class="proj-name">' + esc(p.name) + '</span>' +
      '<span class="proj-count">' + taskCount + ' task' + (taskCount === 1 ? '' : 's') + '</span>' +
      '<button class="icon-btn" data-act="edit" title="Rename">\u270E</button>' +
      '<button class="icon-btn danger" data-act="del" title="Delete">\u2715</button>' +
    '</div>';
  }).join("");

  const html =
    '<div class="m-head">Projects</div>' +
    '<div class="m-body">' +
      '<div class="proj-list" id="proj-list">' +
        (list || '<div class="deps-empty">No projects</div>') +
      '</div>' +
      '<form class="proj-new-form" id="proj-new-form">' +
        '<input type="text" name="name" placeholder="New project name" required autocomplete="off">' +
        '<button type="submit">+ Add</button>' +
      '</form>' +
    '</div>' +
    '<div class="m-foot"><button type="button" data-close class="primary">Close</button></div>';

  openModal(html, (m) => {
    m.querySelector("[data-close]").addEventListener("click", closeModal);

    m.querySelector("#proj-new-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const name = String(fd.get("name") || "").trim();
      if (!name) return;
      try {
        await api("/projects", { method: "POST", body: JSON.stringify({ name }) });
        await reload();
        openProjectsModal();
      } catch (err) { alert(err.message); }
    });

    m.querySelector("#proj-list").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const item = btn.closest(".proj-item");
      const pid = +item.dataset.id;
      const proj = state.projects.find(p => p.id === pid);
      if (!proj) return;

      if (btn.dataset.act === "del") {
        const taskCount = state.tasks.filter(t => t.project_id === pid).length;
        const msg = taskCount
          ? 'Delete project "' + proj.name + '" and its ' + taskCount + ' task(s)?'
          : 'Delete project "' + proj.name + '"?';
        if (!confirm(msg)) return;
        try {
          await api("/projects/" + pid, { method: "DELETE" });
          if (state.currentProject === String(pid)) state.currentProject = "all";
          await reload();
          openProjectsModal();
        } catch (err) { alert(err.message); }
      } else if (btn.dataset.act === "edit") {
        startInlineRename(item, proj);
      }
    });
  });
}

function startInlineRename(itemEl, project) {
  const nameEl = itemEl.querySelector(".proj-name");
  if (!nameEl) return;
  const input = document.createElement("input");
  input.type = "text";
  input.className = "proj-name-input";
  input.value = project.name;
  nameEl.replaceWith(input);
  input.focus();
  input.select();

  let done = false;
  const finish = async (save) => {
    if (done) return;
    done = true;
    const newName = input.value.trim();
    if (save && newName && newName !== project.name) {
      try {
        await api("/projects/" + project.id, {
          method: "PATCH", body: JSON.stringify({ name: newName }),
        });
        await reload();
      } catch (err) { alert(err.message); }
    }
    openProjectsModal();
  };

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    else if (e.key === "Escape") { e.preventDefault(); finish(false); }
  });
  input.addEventListener("blur", () => finish(true));
}

/* ---------- reload ---------- */

async function reload() {
  try {
    await loadAll();
    render();
  } catch (err) {
    console.error(err);
    const st = document.getElementById("status");
    st.innerHTML = '<span class="bad">' + esc(err.message) + '</span>';
  }
}

/* ---------- day navigation ---------- */

function shiftDay(deltaDays) {
  const d = new Date(state.dayStart);
  d.setDate(d.getDate() + deltaDays);
  d.setHours(0, 0, 0, 0);
  state.dayStart = d;
  render();
}
function gotoToday() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  state.dayStart = d;
  render();
}

/* ---------- init ---------- */

async function init() {
  initSidebar();

  document.getElementById("project-select").addEventListener("change", (e) => {
    state.currentProject = e.target.value;
    render();
  });

  document.getElementById("btn-add").addEventListener("click", () => openTaskFormModal(null));

  document.getElementById("btn-autofill").addEventListener("click", async () => {
    try {
      pushUndo();
      const targets = state.currentProject === "all"
        ? state.projects.map(p => p.id)
        : [+state.currentProject];
      for (const pid of targets) {
        await api("/projects/" + pid + "/autofill", { method: "POST" });
      }
      await reload();
    } catch (err) { alert(err.message); }
  });

  document.getElementById("btn-projects").addEventListener("click", openProjectsModal);
  document.getElementById("btn-undo").addEventListener("click", undo);
  document.getElementById("btn-sidebar").addEventListener("click", toggleSidebar);
  document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateThemeIcon);

  document.getElementById("day-prev").addEventListener("click", () => shiftDay(-1));
  document.getElementById("day-next").addEventListener("click", () => shiftDay(1));
  document.getElementById("day-today").addEventListener("click", gotoToday);
  document.getElementById("day-input").addEventListener("change", (e) => {
    try { state.dayStart = parseDateInput(e.target.value); render(); } catch (_) {}
  });

  document.getElementById("zoom-in").addEventListener("click", () => setZoom(zoom * 1.25));
  document.getElementById("zoom-out").addEventListener("click", () => setZoom(zoom / 1.25));
  document.getElementById("zoom-fit").addEventListener("click", resetZoom);

  const scrollEl = document.getElementById("timeline-scroll");
  scrollEl.addEventListener("wheel", (e) => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    const rect = scrollEl.getBoundingClientRect();
    const cursorX = e.clientX - rect.left;
    const oldPx = state.pxPerMin;
    const minutesAtCursor = (scrollEl.scrollLeft + cursorX) / oldPx;

    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    zoom = clampZoom(zoom * factor);
    updateZoomLabel();
    renderTimeline();

    const newPx = state.pxPerMin;
    scrollEl.scrollLeft = minutesAtCursor * newPx - cursorX;
  }, { passive: false });

  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, select, textarea")) {
      if (e.key === "Escape") { closeMenu(); closeModal(); }
      return;
    }
    const isMod = e.ctrlKey || e.metaKey;
    if (isMod && (e.key === "z" || e.key === "Z") && !e.shiftKey) {
      e.preventDefault();
      undo();
      return;
    }
    if (e.key === "Escape") { closeMenu(); closeModal(); }
    else if (e.key === "ArrowLeft") shiftDay(-1);
    else if (e.key === "ArrowRight") shiftDay(1);
    else if (e.key === "t" || e.key === "T") gotoToday();
  });

  window.addEventListener("resize", () => renderTimeline());

  await reload();
  updateUndoBtn();
}

init();
</script>
